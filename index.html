    <!-- ─── FOUC Prevention: theme detection runs before paint ─── -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        // A first visit always starts in the brand's light theme. A later explicit
        // choice via the theme button is preserved in localStorage.
        var theme = saved || 'light';
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', '#0B1120');
        }
      })();
    </script>

    <!-- ─── Critical Inline CSS: prevent flash of unstyled content ─── -->
    <style>
      /* Prevent FOUC: light mode default */
      html { background: #FFFAFF; }
      html[data-theme="dark"] { background: #0B1120; }
      body { margin: 0; }
      #app { min-height: 100vh; }
    </style>
